<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Todo local storage</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <form class="todo">
    <div class="todo__wrapper">
      <input class="enter" type="text" maxlength="45" placeholder="Enter task name">
      <button class="button button_action_add" type="button">Add task</button>
    </div>
    <button class="button button_width_lg button_action_reset" type="button">Reset tasks</button>
    <ul class="tasks todo__tasks"></ul>
  </form>
  <script src="script.js"></script>
</body>
</html>
